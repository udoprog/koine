[package]
name = "koine"
version = "0.3.2"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
rust-version = "1.95"
description = "Locale primitives: ISO 639 languages, ISO 3166-1 countries and valid language+country locales, as compact value types over generated static tables."
documentation = "https://docs.rs/koine"
readme = "README.md"
repository = "https://github.com/udoprog/koine"
license = "(MIT OR Apache-2.0) AND Unicode-3.0"
keywords = ["country", "iso3166", "iso639", "language", "locale"]
categories = ["internationalization", "localization", "no-std", "wasm"]
# The CLDR license must ship with the tables generated from it.
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE-*", "/data/cldr/LICENSE", "/Cargo.toml"]

[workspace]
members = ["tools"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(koine_docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "koine_docsrs"]

# Pre-1.0 public dependencies are named after their version so a later one
# can be added beside them.
[features]
default = ["std", "language", "country", "locale"]
std = ["alloc", "phf?/std", "serde?/std", "musli-core02?/std", "sqll015?/std"]
alloc = ["serde?/alloc", "musli-core02?/alloc", "sqll015?/alloc"]
language = ["dep:phf"]
country = ["dep:phf"]
locale = ["language", "country"]
serde = ["dep:serde"]
musli02 = ["dep:musli-core02"]
sqll015 = ["dep:sqll015"]
yew023 = ["alloc", "dep:yew023"]

[dependencies]
phf = { version = "0.14.0", default-features = false, optional = true }

serde = { version = "1.0.229", default-features = false, optional = true }
musli-core02 = { package = "musli-core", version = "0.2.0", default-features = false, optional = true }
# How sqlite3 is built (`bundled`, `threadsafe`) is the app's choice.
sqll015 = { package = "sqll", version = "0.15.0", default-features = false, optional = true }
yew023 = { package = "yew", version = "0.23.0", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1.0.151"
musli = { version = "0.2.0", features = ["json", "storage", "wire"] }
